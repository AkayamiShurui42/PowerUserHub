name: Community finding
description: Submit learned setting or service behavior from Power User Hub
title: "[Community Finding] "
labels:
  - community-finding
body:
  - type: markdown
    attributes:
      value: |
        Paste the JSON record generated by Power User Hub below. Findings are reviewed before entering the shared runtime catalog.
  - type: textarea
    id: finding
    attributes:
      label: Finding JSON
      description: Keep the device/build metadata intact so observations are not treated as universal across unrelated firmware.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Optional reproduction details, rollback behavior, or anything the automatic observation missed.
