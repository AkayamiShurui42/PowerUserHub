name: Android CI Build

on:
  push:
    branches: [ "main", "master", "pixel17-systemui-overlay" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify PowerUserHub Pixel 17 branch
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout PowerUserHub
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate PowerUserHub Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Checkout upstream Shizuku+ API
        uses: actions/checkout@v7
        with:
          repository: thejaustin/ShizukuPlus-API
          ref: master
          path: vendor/ShizukuPlus-API
          persist-credentials: false

      - name: Install Android 36 SDK for upstream API
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Shizuku+ API from source
        run: |
          chmod +x vendor/ShizukuPlus-API/gradlew
          cd vendor/ShizukuPlus-API
          ./gradlew --no-daemon :aidl:assembleRelease :shared:assembleRelease :api:assembleRelease --stacktrace

      - name: Stage Shizuku+ API AARs
        run: |
          mkdir -p app/libs
          cp vendor/ShizukuPlus-API/aidl/build/outputs/aar/aidl-release.aar app/libs/shizuku-plus-aidl-release.aar
          cp vendor/ShizukuPlus-API/shared/build/outputs/aar/shared-release.aar app/libs/shizuku-plus-shared-release.aar
          cp vendor/ShizukuPlus-API/api/build/outputs/aar/api-release.aar app/libs/shizuku-plus-api-release.aar
          ls -lh app/libs

      - name: Build PowerUserHub
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload PowerUserHub Pixel 17 debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: PowerUserHub-Pixel17-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
