name: Android CI Build

on:
  push:
    branches: [ "main", "master", "pixel17-systemui-overlay" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify app and build Pixel 17 overlay
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run app checks and build APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :pixel17SystemUiOverlay:assembleDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload PowerUserHub debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: PowerUserHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pixel 17 SystemUI overlay APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Pixel17-SystemUI-Overlay-debug-apk
          path: pixel17SystemUiOverlay/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
